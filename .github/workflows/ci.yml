name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
          cache: true

      - name: Vet
        run: go vet ./protocol/... ./loop/... ./gateway/... ./agent/...

      - name: gofmt
        run: test -z "$(gofmt -l protocol gateway loop agent)"

      - name: Test
        run: go test ./protocol/... ./loop/... ./gateway/... ./agent/...

      - name: Race Test
        run: go test -race ./protocol/... ./loop/... ./gateway/... ./agent/...
